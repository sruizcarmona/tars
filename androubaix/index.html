<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Operation Pavé — Visual Debugger</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .legend {
            position: absolute; top: 20px; right: 20px; z-index: 1000;
            background: rgba(255,255,255,0.95); padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); min-width: 180px;
        }
        .legend h3 { margin-bottom: 10px; font-size: 14px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; font-size: 13px; }
        .color-box { width: 18px; height: 18px; margin-right: 10px; border-radius: 3px; flex-shrink: 0; }
        .badge { font-size: 11px; background: #333; color: white; padding: 1px 6px; border-radius: 4px; margin-left: auto; }
        .total-box { margin-top: 10px; padding-top: 8px; border-top: 1px solid #ccc; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="legend">
        <h3>🧱 Operation Pavé</h3>
        <div class="legend-item"><div class="color-box" style="background: #d62728;"></div> Sett (road)</div>
        <div class="legend-item"><div class="color-box" style="background: #ff7f0e;"></div> Sett (pedestrian)</div>
        <div class="legend-item"><div class="color-box" style="background: #2ca02c;"></div> Paving stones</div>
        <div class="legend-item"><div class="color-box" style="background: #777;"></div> Asphalt (gap)</div>
        <div class="total-box" id="total-box">Total: 0m 🤖</div>
    </div>
    <div id="map"></div>

    <script>
        const map = L.map('map').setView([41.4345, 2.1905], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OSM'
        }).addTo(map);

        const H = (p1, p2) => {
            const R = 6371e3, φ1 = p1[0]*Math.PI/180, φ2 = p2[0]*Math.PI/180;
            const Δφ = (p2[0]-p1[0])*Math.PI/180, Δλ = (p2[1]-p1[1])*Math.PI/180;
            const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        };

        // ====== DATA ======
        const streets = [
            {
                name: "Carrer de Pons i Gallarza",
                color: "#d62728",
                segments: [
                    { coords: [[41.4355825,2.1845962],[41.4355998,2.1846558],[41.4356106,2.1846928],[41.4355964,2.1848995],[41.4355706,2.1851908],[41.4355677,2.185223],[41.4355664,2.185243],[41.4354785,2.1865468],[41.4354762,2.1865813],[41.4354749,2.1866026],[41.4354577,2.1868833],[41.4354564,2.186905],[41.4354564,2.1869294],[41.4354578,2.1876497],[41.4354648,2.1880679],[41.435447,2.1884903]], label: "326m" },
                    { coords: [[41.4353533,2.189688],[41.4353665,2.1890632],[41.4353845,2.1889744],[41.4354027,2.1888019],[41.4354179,2.1886345],[41.435447,2.1884903]], label: "101m" }
                ]
            },
            {
                name: "Carrer de Borriana",
                color: "#d62728",
                segments: [
                    { coords: [[41.4310867,2.194627],[41.4310771,2.1945737],[41.4310692,2.19453],[41.4309103,2.1936479],[41.4309025,2.1936039],[41.4308919,2.1935523],[41.4307818,2.1929863],[41.4307767,2.19296],[41.4307714,2.1929302],[41.4305877,2.1919017],[41.4304396,2.19113],[41.4303345,2.1906618],[41.4302751,2.1903661]], label: "367m" }
                ]
            },
            {

                color: "#ff7f0e",
                segments: [
                    { coords: [[41.4302751,2.1903661],[41.4302355,2.190148],[41.430199,2.1899475]], label: "36m" }
                ]
            },
            {

                color: "#d62728",
                segments: [
                    { coords: [[41.4354648,2.1880679],[41.4350264,2.1880676]], label: "49m" },
                    { coords: [[41.4350264,2.1880676],[41.4349738,2.1880645]], label: "6m" },
                    { coords: [[41.4349738,2.1880645],[41.4349634,2.1880627]], label: "1m" }
                ]
            },
            {

                ]
            },
            {

                    { coords: [[41.434706,2.1888169],[41.4347079,2.1887438]], label: "6m" },
                    { coords: [[41.4347079,2.1887438],[41.4347091,2.1887224]], label: "2m" }
                ]
            },
            {
                name: "Carrer de Sant Adrià (sett footway)",
                color: "#ff7f0e",
                segments: [
                    { coords: [[41.4338114,2.1907971],[41.4338493,2.1908013],[41.4338952,2.1908062]], label: "9m" },
                    { coords: [[41.4337778,2.191551],[41.4338187,2.1915472],[41.4338642,2.1915412]], label: "10m" }
                ]
            },
            {

                color: "#d62728",
                segments: [
                    { coords: [[41.4312807,2.1894031],[41.4312709,2.1893578],[41.4311669,2.1888774],[41.4311573,2.1888329],[41.431139,2.1887514],[41.4309385,2.187858],[41.4309266,2.187805],[41.430918,2.1877653],[41.4306305,2.1864318],[41.4305498,2.1860704],[41.430542,2.1860355],[41.4305364,2.1860105],[41.4304251,2.1855163],[41.4303511,2.1851235],[41.4303357,2.1850587],[41.4303058,2.1850121],[41.4302678,2.1849953],[41.4302297,2.1849917]], label: "391m" }
                ]
            },
            {
                name: "Carrer de Coroleu (north)",
                color: "#d62728",
                segments: [
                    { coords: [[41.4326826,2.1893023],[41.4326866,2.18926],[41.4327427,2.1886608],[41.4328644,2.1874614],[41.4329673,2.1865144]], label: "235m" }
                ]
            },
            {
                name: "Carrer de Coroleu (south)",
                color: "#d62728",
                segments: [
                    { coords: [[41.4329673,2.1865144],[41.4330278,2.1858909],[41.4330327,2.1858404],[41.4330385,2.1858002],[41.4331385,2.1848466],[41.4332022,2.1842371],[41.4332073,2.1841879]], label: "196m" }
                ]
            },
            {
                name: "Carrer de Coroleu (paving_stones footways)",
                color: "#2ca02c",
                segments: [
                    { coords: [[41.430635,2.1878919],[41.4307872,2.1879946],[41.4309054,2.1881085],[41.4309623,2.1881604],[41.4310302,2.1881958],[41.4311191,2.1882339],[41.431178,2.1882524],[41.4312733,2.1882818],[41.4313432,2.1882889],[41.4314202,2.1882907],[41.431495,2.1882836],[41.4315734,2.1882736],[41.431654,2.188269],[41.4317309,2.1882717],[41.4318064,2.1882853],[41.431884,2.1883096],[41.4319603,2.1883394],[41.4320338,2.188372]], label: "84m" }
                ]
            },
            {
                name: "Carrer del Doctor Santponç (living_street, paving_stones)",
                color: "#2ca02c",
                segments: [
                    { coords: [[41.431889,2.1932728],[41.4318786,2.1932158],[41.4317906,2.1925726],[41.4317868,2.1925448],[41.4317833,2.192516],[41.4316625,2.1915137],[41.4314655,2.1899969],[41.431394,2.1894355],[41.431387,2.1893804]], label: "329m" },
                    { coords: [[41.431889,2.1932728],[41.4318944,2.1933418],[41.4318988,2.1933734],[41.4319629,2.1938364],[41.4319689,2.1938807],[41.4319749,2.1939247]], label: "55m" }
                ]
            },
            {
                name: "Carrer del Doctor Santponç (residential, paving_stones)",
                color: "#2ca02c",
                segments: [
                    { coords: [[41.4319749,2.1939247],[41.4320237,2.1941383],[41.4322319,2.1950504],[41.4322383,2.1950784],[41.4322453,2.1951436]], label: "106m" }
                ]
            }
        ];

        // Collect totals for the box
        const totals = {};

        streets.forEach(s => {
            const isSett = s.color === "#d62728" || s.color === "#ff7f0e";
            s.segments.forEach(seg => {
                const latlngs = seg.coords.map(c => [c[0], c[1]]);
                const poly = L.polyline(latlngs, { color: s.color, weight: isSett ? 6 : 3, opacity: 0.85 });
                poly.addTo(map);
                poly.bindPopup(`<b>${s.name}</b><br>${seg.label}`);

                // Length label at midpoint
                if (isSett) {
                    const mid = seg.coords[Math.floor(seg.coords.length/2)];
                    const mlabel = L.marker([mid[0], mid[1]], {
                        icon: L.divIcon({
                            className: 'len-label',
                            html: `<div style="background:#fff;border:2px solid ${s.color};border-radius:4px;padding:2px 6px;font-size:11px;font-weight:bold;white-space:nowrap;">${seg.label}</div>`,
                            iconSize: [0, 0],
                            iconAnchor: [0, 0]
                        })
                    });
                    mlabel.addTo(map);
                }

                // Calc running total
                if (isSett) {
                    const len = parseInt(seg.label.replace('m',''));
                    totals[s.name] = (totals[s.name] || 0) + len;
                }
            });
        });

        // Build total
        let totalSett = 0;
        let detailLines = [];
        Object.entries(totals).forEach(([k,v]) => {
            // Don't count pedestrian separately, aggregate by root name
            const root = k.replace(/ \(.*/,'');
            // Just sum everything
            totalSett += v;
        });
        // Simpler: just add up the key ones
        totalSett = Object.values(totals).reduce((a,b)=>a+b,0);

        document.getElementById('total-box').innerHTML = `🧱 Confirmed sett: <strong>${totalSett}m</strong> 🤖<br>
        <span style="font-size:11px;font-weight:normal;">
            Pons i Gallarza: ${totals["Carrer de Pons i Gallarza"] || 0}m · 
            Borriana: ${(totals["Carrer de Borriana"]||0) + (totals["Carrer de Borriana (pedestrian)"]||0)}m · 
            Vintró: ${totals["Carrer de Vintró"] || 0}m · 
            Mercat: ${totals["Carrer del Mercat"] || 0}m · 
            Sant Adrià: ${totals["Carrer de Sant Adrià (sett footway)"] || 0}m
        </span>`;

    </script>
</body>
</html>
