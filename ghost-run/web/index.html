<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ghost-run :: 2025 vs 2026</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #1a1a1a; color: #fff; }
        #map { height: 100vh; width: 100vw; }

        #hud {
            position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.82); padding: 10px 20px; border-radius: 14px;
            display: flex; gap: 22px; z-index: 1000; border: 1px solid #333;
            backdrop-filter: blur(10px); align-items: center;
        }
        .stat { text-align: center; min-width: 88px; }
        .stat-label { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
        .stat-value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
        #gap-value { font-size: 27px; }
        .stat-sub { font-size: 10px; color: #777; margin-top: 2px; }
        .delta-pos { color: #4caf50; }
        .delta-neg { color: #f44336; }

        #controls {
            position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 720px; z-index: 1000;
            background: rgba(0,0,0,0.85); padding: 12px 16px 14px; border-radius: 16px;
            border: 1px solid #333; backdrop-filter: blur(10px);
        }
        .row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
        .row + .row { margin-top: 9px; }
        #gap-graph { width: 100%; height: 56px; display: block; cursor: crosshair; border-radius: 6px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #3498db; }
        #progress-label { font-size: 12px; color: #aaa; font-variant-numeric: tabular-nums; min-width: 104px; text-align: right; }

        .seg { display: inline-flex; border: 1px solid #444; border-radius: 9px; overflow: hidden; }
        .seg button, .pill {
            background: transparent; color: #ccc; border: 0; padding: 6px 12px;
            font-size: 12px; cursor: pointer; font-weight: 600;
        }
        .seg button.active { background: #3498db; color: #fff; }
        .pill { border: 1px solid #444; border-radius: 9px; }
        .pill.active { background: #e67e22; color: #fff; border-color: #e67e22; }
        .pill:disabled { opacity: .4; cursor: not-allowed; }
        #play-btn { width: 40px; font-size: 14px; }

        .off-label { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: .05em; }
        .off-btn {
            background: #262626; color: #eee; border: 1px solid #444; border-radius: 7px;
            width: 28px; height: 28px; font-size: 14px; cursor: pointer; line-height: 1;
        }
        .off-btn:hover { background: #333; }
        #offset-value { font-size: 12px; font-variant-numeric: tabular-nums; min-width: 50px; text-align: center; }
        select {
            background: #262626; color: #eee; border: 1px solid #444; border-radius: 7px;
            padding: 5px 8px; font-size: 12px;
        }
        #route-note { font-size: 11px; color: #8a8a8a; margin-top: 8px; line-height: 1.4; }

        #sections {
            position: absolute; top: 76px; left: 14px; width: 258px;
            background: rgba(0,0,0,0.84); border: 1px solid #333;
            border-radius: 12px; z-index: 1000; font-size: 12px;
            backdrop-filter: blur(10px); display: flex; flex-direction: column; overflow: hidden;
        }
        #sections-toggle {
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
            background: transparent; border: 0; color: #cfcfcf; cursor: pointer;
            padding: 10px 11px; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: .06em; width: 100%; text-align: left;
        }
        #sections-toggle:hover { color: #fff; }
        #sections .chev { font-size: 11px; color: #888; transition: transform .15s ease; }
        #sections.collapsed .chev { transform: rotate(-90deg); }
        #section-list { overflow-y: auto; max-height: 54vh; padding: 0 8px 8px; }
        #sections.collapsed #section-list { display: none; }
        .sec { display: flex; justify-content: space-between; gap: 8px; padding: 5px 7px; border-radius: 6px; cursor: pointer; align-items: baseline; }
        .sec:hover { background: #2a2a2a; }
        .sec .nm { color: #ccc; font-variant-numeric: tabular-nums; }
        .sec .gp { font-weight: 700; font-variant-numeric: tabular-nums; }

        .legend {
            position: absolute; top: 14px; right: 14px;
            background: rgba(0,0,0,0.82); padding: 9px 11px; border-radius: 10px;
            font-size: 12px; z-index: 1000; border: 1px solid #333;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-item + .legend-item { margin-top: 4px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }

        @media (max-width: 760px) {
            #hud { padding: 7px 11px; gap: 12px; }
            .stat { min-width: 66px; }
            .stat-value { font-size: 16px; }
            #gap-value { font-size: 21px; }
            .stat-label { font-size: 9px; }
            #controls { width: 95%; padding: 9px 11px 11px; }
            #sections { width: 178px; top: 66px; }
            #section-list { max-height: 44vh; }
            .legend { font-size: 10px; padding: 6px 8px; }
            #progress-label { min-width: 84px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div id="hud">
        <div class="stat">
            <div class="stat-label">Time Gap</div>
            <div id="gap-value" class="stat-value">--</div>
            <div id="gap-label" class="stat-sub">--</div>
        </div>
        <div class="stat">
            <div class="stat-label">HR &Delta;</div>
            <div id="hr-delta" class="stat-value">--</div>
        </div>
        <div class="stat">
            <div class="stat-label">Pace &Delta;</div>
            <div id="pace-delta" class="stat-value">--</div>
        </div>
    </div>

    <div id="map"></div>

    <div class="legend">
        <div class="legend-item"><div class="dot" style="background: rgba(255,255,255,0.55)"></div> 2025 &middot; ghost</div>
        <div class="legend-item"><div class="dot" style="background: #3498db"></div> 2026 &middot; shared</div>
        <div class="legend-item"><div class="dot" style="background: #e67e22"></div> 2026 &middot; detour</div>
    </div>

    <div id="sections" class="collapsed">
        <button id="sections-toggle" aria-expanded="false">
            <span>Segments (from rejoin)</span><span class="chev">&#9662;</span>
        </button>
        <div id="section-list"></div>
    </div>

    <div id="controls">
        <canvas id="gap-graph"></canvas>
        <div class="row">
            <input type="range" id="dist-slider" min="0" max="100" value="0" step="5">
            <span id="progress-label">0.00 km</span>
        </div>
        <div class="row">
            <button id="play-btn" class="pill" title="Play / pause">&#9654;</button>
            <select id="speed-select" title="Playback speed">
                <option value="1">1&times;</option>
                <option value="2">2&times;</option>
                <option value="5">5&times;</option>
                <option value="10">10&times;</option>
                <option value="30" selected>30&times;</option>
                <option value="60">60&times;</option>
                <option value="120">120&times;</option>
                <option value="300">300&times;</option>
            </select>
            <span class="off-label">Sync by</span>
            <div class="seg">
                <button id="mode-distance" class="active">Distance</button>
                <button id="mode-time">Time</button>
            </div>
            <button id="resync-btn" class="pill">&#8635; Resync</button>
            <span class="off-label" style="margin-left:auto">Nudge</span>
            <button class="off-btn" id="off-minus">&minus;</button>
            <span id="offset-value">0 m</span>
            <button class="off-btn" id="off-plus">+</button>
            <button class="off-btn" id="off-reset" title="Reset nudge">&#8635;</button>
        </div>
        <div id="route-note"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
