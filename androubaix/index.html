<!DOCTYPE html>
<html>
<head>
    <title>Operation Pavé - Visual Debugger</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .legend {
            position: absolute; top: 20px; right: 20px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); color: #333;
        }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .color-box { width: 20px; height: 20px; margin-right: 10px; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="legend">
        <strong>Operation Pavé</strong><br>
        <div class="legend-item"><div class="color-box" style="background: blue;"></div> Confirmed Sett</div>
        <div class="legend-item"><div class="color-box" style="background: orange;"></div> Suspected/Connected</div>
        <div class="legend-item"><div class="color-box" style="background: grey;"></div> Asphalt/Interruption</div>
    </div>
    <div id="map"></div>

    <script>
        const map = L.map('map').setView([41.4305, 2.1920], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Data’s a bit fragmented, so I'm plotting the key "Borriana" segments
        const segments = [
            {
                name: "Carrer de Borriana (Main Sett)",
                coords: [
                    [41.4310867, 2.194627], [41.4310771, 2.1945737], [41.4310692, 2.19453],
                    [41.4309103, 2.1936479], [41.4309025, 2.1936039], [41.4308919, 2.1935523],
                    [41.4307818, 2.1929863], [41.4307767, 2.19296], [41.4307714, 2.1929302],
                    [41.4305877, 2.1919017], [41.4304396, 2.19113], [41.4303345, 2.1906618],
                    [41.4302751, 2.1903661]
                ],
                color: 'blue'
            },
            {
                name: "Carrer de Borriana (Pedestrian Sett)",
                coords: [
                    [41.4302751, 2.1903661], [41.4302355, 2.190148], [41.430199, 2.1899475]
                ],
                color: 'blue'
            },
            {
                name: "Carrer de Borriana (Asphalt Gap)",
                coords: [
                    [41.4310867, 2.194627], [41.431286, 2.1955827] // Approximate connector
                ],
                color: 'grey'
            }
        ];

        segments.forEach(seg => {
            L.polyline(seg.coords, {color: seg.color, weight: 5}).addTo(map).bindPopup(seg.name);
        });
    </script>
</body>
</html>
