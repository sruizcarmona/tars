<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basque Surf Check</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M5,60 C20,15 40,60 55,60 C70,60 80,15 95,45' fill='none' stroke='%23059669' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='65' cy='30' r='4' fill='%23059669'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --go-bg: #ecfdf5;
      --go-text: #059669;
      --go-strong: #10b981;
      --not-bg: #fef2f2;
      --not-text: #f87171;
      --not-strong: #ef4444;
      --wait-bg: #ffffff;
      --wait-text: #e5e7eb;
      --muted: #9ca3af;
      --muted-soft: #d1d5db;
      --line: #e5e7eb;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      max-height: 100vh;
      max-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      padding-bottom: 4rem;
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    body.state-go { background: var(--go-bg); color: var(--go-text); }
    body.state-not { background: var(--not-bg); color: var(--not-text); }
    body.state-wait { background: var(--wait-bg); color: var(--wait-text); }
    body.state-error { background: #f9fafb; color: #9ca3af; }

    .topbar {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      right: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      z-index: 10;
    }

    .topbar-left { display: flex; align-items: center; gap: 0.5rem; }
    .brand {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      display: none;
    }
    @media (min-width: 640px) { .brand { display: inline; } }

    #beach {
      font-size: 0.875rem;
      font-weight: 500;
      background: transparent;
      border: 0;
      border-bottom: 2px solid var(--line);
      padding: 0.25rem 1.5rem 0.25rem 0;
      outline: none;
      cursor: pointer;
      color: #374151;
      font-family: inherit;
    }
    #beach:focus { border-bottom-color: #9ca3af; }

    .topbar-right { display: flex; align-items: center; gap: 0.75rem; }
    .icon-btn {
      font-size: 1.125rem;
      line-height: 1;
      padding: 0.25rem 0.5rem;
      border: 0;
      border-radius: 0.5rem;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
      font-family: inherit;
    }
    .icon-btn:hover { background: rgba(0,0,0,0.05); color: #eab308; }
    #btnRefresh:hover { color: #6b7280; }

    main {
      text-align: center;
      padding: clamp(3rem, 8vh, 5rem) 1.5rem;
      flex: 1;
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #beachName {
      margin-bottom: 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    body.state-go #beachName { color: var(--go-strong); }
    body.state-not #beachName { color: var(--not-strong); }
    body.state-wait #beachName, body.state-error #beachName { color: var(--muted-soft); }

    #verdict {
      font-size: clamp(3rem, min(20vw, 24vh), 14rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
      transition: transform 0.3s ease;
    }
    #verdict:hover { transform: scale(1.02); }
    body.state-go #verdict { color: var(--go-text); }
    body.state-not #verdict { color: var(--not-text); }
    body.state-wait #verdict, body.state-error #verdict { color: var(--muted-soft); }

    #timeWindow {
      margin-top: 1rem;
      font-size: 1rem;
      font-weight: 500;
    }
    body.state-go #timeWindow { color: var(--go-strong); }
    body.state-not #timeWindow { color: var(--not-strong); }
    body.state-wait #timeWindow, body.state-error #timeWindow { color: var(--muted-soft); }

    #metrics {
      margin-top: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      font-size: 0.875rem;
      color: var(--muted);
    }
    #metrics .dot {
      display: inline-block;
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 9999px;
      margin-right: 0.375rem;
    }
    body.state-go #metrics .dot { background: var(--go-strong); }
    body.state-not #metrics .dot { background: #fca5a5; }
    #metrics .sep { color: var(--muted-soft); }
    #metrics .score {
      font-size: 0.625rem;
      letter-spacing: 0.05em;
      font-family: ui-monospace, monospace;
    }
    body.state-go #metrics .score { color: #34d399; }
    body.state-not #metrics .score { color: #fca5a5; }

    #updated { margin-top: 2.5rem; font-size: 0.625rem; color: var(--muted-soft); }

    #dayBar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: stretch;
      justify-content: center;
      overflow-x: auto;
      z-index: 20;
    }
    #dayBar.hidden { display: none; }
    .day-cell {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.125rem;
      padding: 0.75rem 0.5rem;
      min-width: 0;
    }
    .day-cell.go { background: var(--go-strong); color: #fff; }
    .day-cell.not { background: var(--line); color: #6b7280; }
    .day-cell .d-label { font-size: 0.625rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.2; }
    .day-cell .d-verdict { font-size: 0.6875rem; font-weight: 900; line-height: 1.2; }
    .day-cell.go .d-verdict { color: #fff; }
    .day-cell.not .d-verdict { color: #9ca3af; }
    .day-cell .d-wh { font-size: 0.5625rem; opacity: 0.6; line-height: 1.2; }

    .fade-in { animation: fadeIn 0.5s ease forwards; }
    .fade-in-delayed { animation: fadeIn 0.5s ease 0.3s forwards; opacity: 0; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
      .fade-in, .fade-in-delayed { opacity: 1 !important; }
    }
  </style>
</head>
<body class="state-wait">
  <div class="topbar">
    <div class="topbar-left">
      <span class="brand">Basque Surf</span>
      <select id="beach">
        <option value="auto">Auto — Best Beach</option>
      </select>
    </div>
    <div class="topbar-right">
      <button id="btnAuto" title="Best Beach (auto)" class="icon-btn">&starf;</button>
      <button id="btnRefresh" title="Refresh" class="icon-btn">&olarr;</button>
    </div>
  </div>

  <main>
    <div id="beachName">&nbsp;</div>
    <div id="verdict">?</div>
    <div id="timeWindow">&nbsp;</div>
    <div id="metrics"><span>...</span></div>
    <div id="updated"></div>
  </main>

  <div id="dayBar" class="hidden"></div>

  <script>
    const CACHE_KEY = 'bsc:cache:v1'
    const CACHE_TTL = 30 * 60 * 1000
    const CACHE_MAX_AGE = 6 * 60 * 60 * 1000
    const AUTO_REFRESH_MS = 15 * 60 * 1000

    const BEACHES = [
      { id: 'zarautz', name: 'Zarautz', lat: 43.284, lon: -2.171, offshoreMin: 140, offshoreMax: 220 },
      { id: 'mundaka', name: 'Mundaka', lat: 43.407, lon: -2.697, offshoreMin: 150, offshoreMax: 230 },
      { id: 'sopelana', name: 'Sopelana', lat: 43.382, lon: -2.983, offshoreMin: 140, offshoreMax: 220 },
      { id: 'plentzia', name: 'Plentzia', lat: 43.406, lon: -2.950, offshoreMin: 140, offshoreMax: 220 },
      { id: 'bakio', name: 'Bakio', lat: 43.427, lon: -2.811, offshoreMin: 150, offshoreMax: 230 },
      { id: 'donostia', name: 'Donostia', lat: 43.318, lon: -1.982, offshoreMin: 150, offshoreMax: 230 },
    ]

    const TRIGGERS = {
      go: { text: 'GO SURFING', state: 'state-go' },
      not: { text: 'NO', state: 'state-not' },
      wait: { text: '?', state: 'state-wait' },
    }

    const state = { allData: null, results: {}, bestId: null, selectedId: 'auto' }

    const $ = s => document.querySelector(s)
    const $$ = s => document.querySelectorAll(s)

    const MADRID = 'Europe/Madrid'

    function fmtTime(iso) {
      const d = new Date(iso)
      return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: MADRID })
    }

    function fmtHour(iso) {
      const d = new Date(iso)
      return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: MADRID }).slice(0, 2) + ':00'
    }

    function scoreWave(waveHeight, wavePeriod, windSpeed, windDir, offshoreMin, offshoreMax) {
      if (waveHeight == null || wavePeriod == null) return 0
      if (waveHeight < 0.5 || wavePeriod < 6) return 0
      let s = 0
      if (waveHeight >= 1.0 && waveHeight <= 2.5) s += 40
      else if ((waveHeight >= 0.6 && waveHeight < 1.0) || (waveHeight > 2.5 && waveHeight <= 3.5)) s += 20
      else if (waveHeight >= 0.5 && waveHeight < 0.6) s += 5
      if (wavePeriod >= 12) s += 30
      else if (wavePeriod >= 9) s += 25
      else if (wavePeriod >= 7) s += 15
      else if (wavePeriod >= 6) s += 5
      if (windSpeed != null) {
        if (windSpeed < 8) s += 20
        else if (windSpeed < 15) s += 15
        else if (windSpeed < 25) s += 5
      }
      if (windDir != null) {
        if (windDir >= offshoreMin && windDir <= offshoreMax) s += 10
        else {
          const dist = Math.min(Math.abs(windDir - offshoreMin), Math.abs(windDir - offshoreMax))
          if (dist <= 30) s += 5
        }
      }
      return s
    }

    function analyzeBeach(data, beach) {
      if (!data || !data.hourly) return { maxScore: 0, bestHour: null, days: [] }
      const { hourly } = data
      const times = hourly.time
      if (!times || !times.length) return { maxScore: 0, bestHour: null, days: [] }

      const now = new Date()
      const scores = []
      for (let i = 0; i < times.length; i++) {
        const t = new Date(times[i])
        if (t <= now) continue
        const hour = parseInt(times[i].substring(11, 13), 10)
        if (hour < 7 || hour > 21) continue
        const wh = hourly.wave_height
        const wp = hourly.wave_period
        const ws = hourly.wind_speed_10m
        const wd = hourly.wind_direction_10m
        const sh = wh && wh.length > i ? wh[i] : null
        const sp = wp && wp.length > i ? wp[i] : null
        const ss = ws && ws.length > i ? ws[i] : null
        const sd = wd && wd.length > i ? wd[i] : null
        const score = scoreWave(sh, sp, ss, sd, beach.offshoreMin, beach.offshoreMax)
        scores.push({ idx: i, score, time: times[i], wh: sh, wp: sp, ws: ss, wd: sd })
      }

      if (scores.length === 0) return { maxScore: 0, bestHour: null, days: [] }

      const todayStr = times[0].substring(0, 10)
      const dayMap = {}
      for (const s of scores) {
        const d = s.time.substring(0, 10)
        if (!dayMap[d]) dayMap[d] = []
        dayMap[d].push(s)
      }

      const sortedDates = Object.keys(dayMap).sort()
      const days = []
      let overallMax = -1
      let overallBest = null

      for (const date of sortedDates) {
        const entries = dayMap[date]
        let bi = 0
        for (let i = 1; i < entries.length; i++) {
          if (entries[i].score > entries[bi].score) bi = i
        }
        const b = entries[bi]
        const ms = Math.round(b.score)

        const dObj = new Date(date + 'T12:00:00')
        const tObj = new Date(todayStr + 'T12:00:00')
        const diff = Math.round((dObj - tObj) / 86400000)
        const label = diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : dObj.toLocaleDateString('en', { weekday: 'short' })

        days.push({ date, label, maxScore: ms, bestHour: { time: b.time, wh: b.wh, wp: b.wp, ws: b.ws, wd: b.wd } })

        if (ms > overallMax) {
          overallMax = ms
          overallBest = b
        }
      }

      return {
        maxScore: overallMax,
        bestHour: overallBest ? { time: overallBest.time, wh: overallBest.wh, wp: overallBest.wp, ws: overallBest.ws, wd: overallBest.wd } : null,
        days,
      }
    }

    async function fetchJSON(url, label) {
      const res = await fetch(url)
      if (!res.ok) throw new Error(`${label} returned status ${res.status}`)
      const json = await res.json()
      if (!Array.isArray(json)) throw new Error(`${label} returned non-array: ${JSON.stringify(json).slice(0,200)}`)
      return json
    }

    function safeArr(v) { return Array.isArray(v) ? v : [] }

    async function fetchAll() {
      const lats = BEACHES.map(b => b.lat).join(',')
      const lons = BEACHES.map(b => b.lon).join(',')
      const base = 'forecast_days=4&timezone=Europe/Madrid'
      const marineUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${lats}&longitude=${lons}&hourly=wave_height,wave_period&${base}`
      const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&hourly=wind_speed_10m,wind_direction_10m&${base}`

      const [marineArr, weatherArr] = await Promise.all([
        fetchJSON(marineUrl, 'Marine'),
        fetchJSON(weatherUrl, 'Weather').catch(e => { console.warn('Weather fetch failed:', e); return [] }),
      ])

      const result = []
      const count = Math.max(marineArr.length, 1)
      for (let i = 0; i < count && i < BEACHES.length; i++) {
        const m = marineArr[i] || {}
        const w = weatherArr[i] || {}
        result.push({
          beachIdx: i,
          hourly: {
            time: safeArr(m.hourly && m.hourly.time),
            wave_height: safeArr(m.hourly && m.hourly.wave_height),
            wave_period: safeArr(m.hourly && m.hourly.wave_period),
            wind_speed_10m: safeArr(w.hourly && w.hourly.wind_speed_10m),
            wind_direction_10m: safeArr(w.hourly && w.hourly.wind_direction_10m),
          },
        })
      }
      return result
    }

    function buildResults(locations) {
      const results = {}
      let bestScore = -1
      let bestId = BEACHES[0].id
      locations.forEach((loc, i) => {
        const beach = BEACHES[i]
        if (!beach) return
        const result = analyzeBeach(loc, beach)
        results[beach.id] = result
        if (result.maxScore > bestScore) {
          bestScore = result.maxScore
          bestId = beach.id
        }
      })
      return { results, bestId }
    }

    function setState(cls) {
      document.body.className = cls
    }

    function renderVerdict(beach, result, note) {
      const isGo = result.maxScore >= 75
      const trigger = isGo ? TRIGGERS.go : TRIGGERS.not

      setState(trigger.state)
      $('#beachName').textContent = beach ? `${beach.name}` : ' '
      $('#beachName').className = `mb-4 text-xs font-medium tracking-widest uppercase fade-in`

      const verdictEl = $('#verdict')
      verdictEl.textContent = trigger.text
      verdictEl.className = 'fade-in'

      if (result.bestHour) {
        const h = result.bestHour
        $('#timeWindow').textContent = isGo ? `Best: ${fmtHour(h.time)}` : '—'
        $('#timeWindow').className = 'mt-4 text-base font-medium fade-in-delayed'
        const wh = h.wh != null ? `${h.wh.toFixed(1)}m` : '--'
        const wp = h.wp != null ? `${h.wp}s` : '--'
        const ws = h.ws != null ? `${Math.round(h.ws)}km/h` : '--'
        const scorePct = Math.min(100, result.maxScore)
        const bars = '■'.repeat(Math.ceil(scorePct / 10)) + '□'.repeat(10 - Math.ceil(scorePct / 10))
        $('#metrics').innerHTML = `
          <span><span class="dot"></span>${wh}</span>
          <span class="sep">|</span>
          <span><span class="dot"></span>${wp}</span>
          <span class="sep">|</span>
          <span><span class="dot"></span>${ws}</span>
          <span class="sep">|</span>
          <span class="score">${bars} ${result.maxScore}</span>
        `
      } else {
        $('#timeWindow').textContent = 'No forecast available'
        $('#metrics').innerHTML = '<span>No data for this beach</span>'
      }

      const stamp = note || `Updated ${new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`
      $('#updated').textContent = stamp

      const barEl = $('#dayBar')
      if (result.days && result.days.length > 1) {
        let html = ''
        for (const d of result.days) {
          const dayGo = d.maxScore >= 75
          const wh = d.bestHour && d.bestHour.wh != null ? `${d.bestHour.wh.toFixed(1)}m` : '--'
          html += `
            <div class="day-cell ${dayGo ? 'go' : 'not'}">
              <span class="d-label">${d.label}</span>
              <span class="d-verdict">${dayGo ? 'GO' : 'NO'}</span>
              <span class="d-wh">${wh}</span>
            </div>
          `
        }
        barEl.innerHTML = html
        barEl.classList.remove('hidden')
      } else {
        barEl.classList.add('hidden')
      }
    }

    function renderWaiting() {
      setState('state-wait')
      $('#beachName').textContent = ' '
      $('#verdict').textContent = '?'
      $('#verdict').className = ''
      $('#timeWindow').textContent = ' '
      $('#metrics').innerHTML = '<span class="pulse">Loading forecast...</span>'
      $('#updated').textContent = ''
      $('#dayBar').classList.add('hidden')
    }

    function renderError(msg) {
      setState('state-error')
      $('#beachName').textContent = ' '
      $('#verdict').textContent = '?'
      $('#verdict').className = ''
      $('#timeWindow').textContent = msg || 'Unable to fetch data'
      $('#metrics').innerHTML = '<span style="font-size:0.75rem">Check your connection or try again</span>'
      $('#updated').textContent = ''
      $('#dayBar').classList.add('hidden')
    }

    function updateView(note) {
      const { results, bestId, selectedId } = state
      if (Object.keys(results).length === 0) { renderWaiting(); return }

      const beachId = selectedId === 'auto' ? bestId : selectedId
      const beach = BEACHES.find(b => b.id === beachId)
      if (!beach || !results[beachId]) { renderWaiting(); return }

      renderVerdict(beach, results[beachId], note)
    }

    function populateSelect() {
      const sel = $('#beach')
      sel.innerHTML = '<option value="auto">Auto — Best Beach</option>'
      BEACHES.forEach(b => {
        const opt = document.createElement('option')
        opt.value = b.id
        opt.textContent = b.name
        sel.appendChild(opt)
      })
      sel.value = state.selectedId || 'auto'
    }

    function cacheGet() {
      try {
        const raw = localStorage.getItem(CACHE_KEY)
        if (!raw) return null
        const parsed = JSON.parse(raw)
        if (!parsed || !Array.isArray(parsed.locations)) return null
        return parsed
      } catch (e) {
        return null
      }
    }

    function cacheSet(locations) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ locations, savedAt: Date.now() }))
      } catch (e) {
        console.warn('Cache write failed:', e)
      }
    }

    function relativeTime(ts) {
      const mins = Math.max(0, Math.round((Date.now() - ts) / 60000))
      if (mins < 1) return 'just now'
      if (mins < 60) return `${mins} min ago`
      const hrs = Math.round(mins / 60)
      return `${hrs} hr${hrs > 1 ? 's' : ''} ago`
    }

    async function loadData() {
      const cached = cacheGet()
      const cacheAge = cached ? Date.now() - (cached.savedAt || 0) : Infinity

      if (cached && cacheAge < CACHE_MAX_AGE) {
        const { results, bestId } = buildResults(cached.locations)
        state.allData = cached.locations
        state.results = results
        state.bestId = bestId
        const fresh = cacheAge < CACHE_TTL
        updateView(`Updated ${relativeTime(cached.savedAt)}${fresh ? '' : ' (cached)'}`)
      } else if (!cached) {
        renderWaiting()
      }

      try {
        const locations = await fetchAll()
        cacheSet(locations)
        const { results, bestId } = buildResults(locations)
        state.allData = locations
        state.results = results
        state.bestId = bestId
        if (state.selectedId === 'auto') populateSelect()
        updateView(`Updated ${relativeTime(Date.now())}`)
      } catch (err) {
        console.error(err)
        if (!cached) renderError(err.message)
      }
    }

    function scheduleAutoRefresh() {
      setInterval(() => {
        const cached = cacheGet()
        const age = cached ? Date.now() - (cached.savedAt || 0) : Infinity
        if (age >= CACHE_TTL) loadData()
      }, AUTO_REFRESH_MS)
    }

    $('#beach').addEventListener('change', e => {
      state.selectedId = e.target.value
      updateView()
    })

    $('#btnAuto').addEventListener('click', () => {
      state.selectedId = 'auto'
      populateSelect()
      updateView()
    })

    $('#btnRefresh').addEventListener('click', () => {
      loadData()
    })

    populateSelect()
    loadData()
    scheduleAutoRefresh()
  </script>
</body>
</html>
